<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronocept Revolutions</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .detail-wrap{max-width:820px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--blue-teal); text-decoration:none; margin-bottom:22px;}
  .back-link:hover{color:var(--blue);}
  .video-embed-placeholder{
    aspect-ratio:16/9; width:100%; border-radius:14px; margin-bottom:28px;
    background:linear-gradient(135deg, var(--blue-sky), var(--blue-navy));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--paper-card); text-align:center; padding:20px;
  }
  .video-embed-placeholder .play-lg{
    width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.92);
    display:flex; align-items:center; justify-content:center;
  }
  .video-embed-placeholder .play-lg svg{width:22px; height:22px; margin-left:3px;}
  .video-embed-placeholder p{font-family:var(--mono); font-size:12.5px; max-width:360px; color:var(--blue-mist); margin:0;}
  .detail-tag-row{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 6px;}
  .detail-tag{font-size:12px; background:var(--blue-mist); color:var(--blue-deep); padding:5px 12px; border-radius:14px;}
  .detail-title{font-size:clamp(26px,4vw,38px); margin-bottom:10px;}
  .detail-meta{font-family:var(--mono); font-size:12.5px; color:var(--ink-faint); display:flex; gap:14px; flex-wrap:wrap; margin-bottom:24px;}
  .contributor-credit{
    display:flex; align-items:center; gap:12px; margin:0 0 28px; padding:14px 18px;
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px;
  }
  .contributor-credit img{width:44px; height:44px; border-radius:50%; object-fit:cover; flex:none;}
  .contributor-credit .label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
  .contributor-credit .name{font-family:var(--serif); font-size:15px; color:var(--ink);}
  .blog-section{margin-bottom:30px;}
  .blog-label{font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:var(--blue-teal); margin-bottom:8px; display:block;}
  .blog-section p{font-size:16.5px; color:var(--ink); line-height:1.75; margin:0;}
  .related-section{background:var(--paper-card-2);}
  .not-found{padding:140px 0 160px; text-align:center;}

  /* ---------- FULL RESEARCH ARTICLE (converted from Word docs) ---------- */
  .research-article{font-size:16px; color:var(--ink); line-height:1.8;}
  .research-article h2{font-size:22px; margin:34px 0 12px;}
  .research-article h3{font-size:18px; margin:26px 0 10px;}
  .research-article p{margin:0 0 18px;}
  .research-article ul, .research-article ol{margin:0 0 18px; padding-left:22px;}
  .research-article li{margin-bottom:6px;}
  .research-article a{color:var(--blue-teal); text-decoration:underline; text-underline-offset:2px;}
  .research-article a:hover{color:var(--blue);}
  /* footnote-style citation markers inline in the text, e.g. text<sup><a href="#ref1">1</a></sup> */
  .research-article sup a{
    font-size:11px; font-weight:700; text-decoration:none; color:var(--blue-teal);
    padding:0 2px;
  }
  .research-article sup a:hover{text-decoration:underline;}
  /* references list at the bottom of the article */
  .research-article .ref-list{
    margin-top:34px; padding-top:22px; border-top:1px solid var(--line);
    list-style:none; padding-left:0; counter-reset:ref;
  }
  .research-article .ref-list li{
    counter-increment:ref; font-size:13.5px; color:var(--ink-soft);
    padding-left:26px; position:relative; margin-bottom:10px; line-height:1.6;
  }
  .research-article .ref-list li::before{
    content:"[" counter(ref) "]"; position:absolute; left:0; color:var(--ink-faint);
    font-family:var(--mono); font-size:12px;
  }
  .research-article .ref-list a{word-break:break-word;}
  .research-article .ref-back{margin-left:6px; text-decoration:none;}

  /* table of contents box, jumps to sections lower on the same page */
  .research-toc{
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px;
    padding:20px 24px; margin-bottom:30px;
  }
  .research-toc .toc-label{
    font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em;
    font-size:12px; color:var(--blue-teal); display:block; margin-bottom:10px;
  }
  .research-toc ol{margin:0; padding-left:20px;}
  .research-toc ol ol{margin-top:4px; padding-left:20px;}
  .research-toc li{margin-bottom:5px; font-size:14px;}
  .research-toc a{color:var(--ink); text-decoration:none;}
  .research-toc a:hover{color:var(--blue-teal); text-decoration:underline;}

  /* acronym list + data tables pulled from the Word doc */
  .research-article table{
    width:100%; border-collapse:collapse; margin:0 0 20px; font-size:14px;
  }
  .research-article caption{
    text-align:left; font-family:var(--mono); font-size:12px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-faint); margin-bottom:8px; caption-side:top;
  }
  .research-article th, .research-article td{
    text-align:left; padding:9px 12px; border-bottom:1px solid var(--line);
  }
  .research-article th{font-family:var(--mono); font-size:11.5px; text-transform:uppercase; color:var(--ink-faint);}
  .research-article .table-source{font-size:12.5px; color:var(--ink-faint); margin:-8px 0 24px;}

  .research-article .case-callout{
    background:var(--paper-card-2); border-left:4px solid var(--blue-teal);
    border-radius:8px; padding:16px 20px; margin:0 0 24px;
  }
  .research-article .case-callout p{margin:8px 0 0;}
</style>
</head>
<body data-page="content.html">
<div id="siteNav"></div>

<section id="detailSection" style="display:none;">
  <div class="wrap detail-wrap">
    <a href="content.html" class="back-link">&larr; Back to Content Library</a>
    <div id="videoEmbedMount"></div>
    <span class="eyebrow" id="detailCountry"></span>
    <h1 class="detail-title" id="detailTitle"></h1>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-tag-row" id="detailTags"></div>
    <div id="detailContributor"></div>

    <div class="blog-section">
      <span class="blog-label">The Issue</span>
      <p id="detailIssue"></p>
    </div>
    <div class="blog-section">
      <span class="blog-label">How Others Do It</span>
      <p id="detailHow"></p>
    </div>
    <div class="blog-section">
      <span class="blog-label">The Solution</span>
      <p id="detailSolution"></p>
    </div>

    <div class="blog-section" id="researchSection" style="display:none;">
      <span class="blog-label">Full Research</span>
      <div class="research-article" id="researchMount"></div>
    </div>
  </div>
</section>

<section class="related-section" id="relatedSection" style="display:none;">
  <div class="wrap">
    <div class="section-head tight">
      <span class="eyebrow">Keep exploring</span>
      <h2>Related content</h2>
    </div>
    <div class="content-grid" id="relatedGrid"></div>
  </div>
</section>

<section class="not-found" id="notFoundSection" style="display:none;">
  <div class="wrap">
    <span class="eyebrow">Not found</span>
    <h1>We couldn't find that content</h1>
    <p style="max-width:480px;margin:0 auto 28px;">It may have been removed, or the link is out of date.</p>
    <a href="content.html" class="btn btn-primary">Back to Content Library</a>
  </div>
</section>

<div id="siteFooter"></div>

<script src="assets/shared.js"></script>
<script src="assets/content-data.js"></script>
<script src="assets/content-render.js"></script>
<script src="assets/youtube.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const item = getContentById(params.get("id"));

  if (!item) {
    document.getElementById("notFoundSection").style.display = "block";
  } else {
    document.title = item.title + ": Chronocept Revolutions";
    document.getElementById("detailSection").style.display = "block";
    document.getElementById("relatedSection").style.display = "block";

    if (item.youtubeVideoId) {
      document.getElementById("videoEmbedMount").innerHTML = `
        <div style="aspect-ratio:16/9;width:100%;border-radius:14px;overflow:hidden;margin-bottom:28px;">
          <iframe style="width:100%;height:100%;border:0;" src="https://www.youtube.com/embed/${item.youtubeVideoId}" title="${item.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>`;
      syncYouTubeStats([item]).then(() => {
        document.getElementById("detailMeta").innerHTML =
          `<span>${formatDate(item.publishedAt)}</span><span>&middot;</span><span>${formatViews(item.views)}</span>`;
      });
    } else {
      document.getElementById("videoEmbedMount").innerHTML = `
        <div class="video-embed-placeholder">
          <div class="play-lg"><svg viewBox="0 0 24 24" fill="#243824"><path d="M8 5v14l11-7z"/></svg></div>
          <p>This item isn't linked to a YouTube video yet. Add a youtubeVideoId in content-data.js to embed it here.</p>
        </div>`;
    }

    document.getElementById("detailCountry").textContent = item.country ? item.country.name : "Global";
    document.getElementById("detailTitle").textContent = item.title;
    document.getElementById("detailMeta").innerHTML =
      `<span>${formatDate(item.publishedAt)}</span><span>&middot;</span><span>${formatViews(item.views)}</span>`;
    document.getElementById("detailTags").innerHTML = item.tags.map((t) => `<span class="detail-tag">${t}</span>`).join("");
    document.getElementById("detailIssue").textContent = item.issue;
    document.getElementById("detailHow").textContent = item.howOthersDoIt;
    document.getElementById("detailSolution").textContent = item.solution;

    if (item.contributor) {
      document.getElementById("detailContributor").innerHTML = `
        <div class="contributor-credit">
          <img src="${item.contributor.photo}" alt="${item.contributor.name}">
          <div>
            <div class="label">Submitted by</div>
            <div class="name">${item.contributor.name}</div>
          </div>
        </div>`;
    }

    if (item.researchFile) {
      fetch(item.researchFile)
        .then((res) => (res.ok ? res.text() : Promise.reject()))
        .then((html) => {
          document.getElementById("researchMount").innerHTML = html;
          document.getElementById("researchSection").style.display = "block";
        })
        .catch(() => {
          document.getElementById("researchSection").style.display = "none";
        });
    }

    renderCardGrid(document.getElementById("relatedGrid"), getRelatedContent(item, 4));
  }
</script>
</body>
</html>
